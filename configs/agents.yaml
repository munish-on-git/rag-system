# configs/agents.yaml
model:
  provider: "groq"
  guardrail_model: "meta-llama/llama-prompt-guard-2-86m"
  generation_model: "openai/gpt-oss-120b"

retrieval:
  strategy: "passage_baseline"
  candidate_k: 20    # pulled from FAISS before reranking
  top_k: 5           # kept after reranking, sent to the generator
  reranker_model: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"

guardrails:
  input_check: true
  jailbreak_threshold: 0.5
  output_grounding_check: true
  min_context_overlap: 0.35   # raised from 0.15 -- old value let out-of-corpus
                               # answers through when the LLM used pretrained
                               # knowledge instead of the retrieved context